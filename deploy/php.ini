; Réglages PHP pour PersonaVault dans un conteneur
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 600
max_input_time = 300
date.timezone = Europe/Paris
expose_php = Off

; Le code change à chaque déploiement : on garde l'OPcache pour la vitesse
; mais on valide les timestamps (pas de cache figé entre deux builds).
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
