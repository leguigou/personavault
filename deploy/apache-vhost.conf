# PersonaVault — tout passe par public/index.php (même comportement que
# `php -S ... public/index.php` en local), sauf les assets existants.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Sons/headers : inutiles de les divulguer
    ServerSignature Off
    Header unset X-Powered-By

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
